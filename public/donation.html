<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Donation - Helping Hands Foundation</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <header>
        <h1>Support Our Work</h1>

        <nav>
            <a href="/">Home</a>
            <a href="/about.html">About Us</a>
            <a href="/activities.html">Activities</a>
            <a href="/events.html">Events</a>
            <a href="/volunteer.html">Volunteer</a>
            <a href="/donation.html">Donation</a>
            <a href="/contact.html">Contact Us</a>
        </nav>
    </header>

    <main class="container">

        <section class="card">
            <h2>Make a Donation Pledge</h2>

            <p>
                Your support helps us provide education,
                food, and other services to people in need.
            </p>

            <p>
                <strong>Note:</strong> This is a college project.
                No real payment will be collected.
            </p>

            <form action="/donate" method="POST">

                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name"
                       placeholder="Enter your name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email" required>

                <label for="amount">Donation Amount (₹):</label>
                <input type="number" id="amount" name="amount"
                       min="1" step="1"
                       placeholder="Enter amount" required>

                <button type="submit">Submit Pledge</button>

            </form>
        </section>

    </main>

    <footer>
        <p>© 2026 Helping Hands Foundation</p>
    </footer>

</body>
</html>
