<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Volunteer Registration - Helping Hands Foundation</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <header>
        <h1>Become a Volunteer</h1>

        <nav>
            <a href="/">Home</a>
            <a href="/about.html">About Us</a>
            <a href="/activities.html">Activities</a>
            <a href="/events.html">Events</a>
            <a href="/volunteer.html">Volunteer</a>
            <a href="/donation.html">Donation</a>
            <a href="/contact.html">Contact Us</a>
        </nav>
    </header>

    <main class="container">

        <section class="card">
            <h2>Volunteer Registration</h2>

            <p>
                Join our NGO and help people in need.
                Fill in the form below to register.
            </p>

            <form action="/volunteer" method="POST">

                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name"
                       placeholder="Enter your name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email" required>

                <label for="interest">Area of Interest:</label>
                <select id="interest" name="interest" required>
                    <option value="">Select an activity</option>
                    <option value="Education">Education</option>
                    <option value="Food Distribution">Food Distribution</option>
                    <option value="Cleanliness Campaign">Cleanliness Campaign</option>
                    <option value="Healthcare">Healthcare</option>
                    <option value="Environmental Awareness">Environmental Awareness</option>
                    <option value="Other">Other</option>
                </select>

                <button type="submit">Register</button>

            </form>
        </section>

    </main>

    <footer>
        <p>© 2026 Helping Hands Foundation</p>
    </footer>

</body>
</html>
